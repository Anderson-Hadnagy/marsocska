<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --border-color: #00e5ff10; /* Cyan neon color */
      --bg-color: rgba(13, 25, 51, 0.37); /* Semi-transparent dark background */
      --border-width: 2px;
      
      /* Size of the corner cuts */
      --cut-size-outer: 25px;
      /* Mathematically scales the inner cut so the border thickness remains perfectly even */
      --cut-size-inner: calc(var(--cut-size-outer) - (var(--border-width) * 0.5858));
    }

    body {
      margin: 0;
      /* Set to transparent for Electron, using a dark color here just for web preview */
      background-color: transparent; 
      color: #00e5ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      padding: 20px; /* Padding to show the drop-shadow inside the window bounds */
      box-sizing: border-box;
    }

    /* Wrapper to apply a glow effect. 
      Regular box-shadow gets clipped by clip-path, so we use filter: drop-shadow on a parent.
    */
    .sci-fi-wrapper {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.4));
    }

    .sci-fi-border {
      background: var(--border-color);
      padding: var(--border-width);
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      
      /* Cuts the Top-Left and Bottom-Right corners */
      clip-path: polygon(
        var(--cut-size-outer) 0, 
        100% 0, 
        100% calc(100% - var(--cut-size-outer)), 
        calc(100% - var(--cut-size-outer)) 100%, 
        0 100%, 
        0 var(--cut-size-outer)
      );
    }

    .sci-fi-app {
      background: var(--bg-color);
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;

      /* Matches the outer cut, adjusted for border width */
      clip-path: polygon(
        var(--cut-size-inner) 0, 
        100% 0, 
        100% calc(100% - var(--cut-size-inner)), 
        calc(100% - var(--cut-size-inner)) 100%, 
        0 100%, 
        0 var(--cut-size-inner)
      );
    }

    /* --- Electron Specific UI --- */

    .titlebar {
      /* This tells Electron to make this area draggable */
      -webkit-app-region: drag; 
      height: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      background: rgba(0, 229, 255, 0.1);
      border-bottom: 1px solid rgba(0, 229, 255, 0.3);
      font-weight: bold;
      letter-spacing: 2px;
      user-select: none;
    }

    .close-btn {
      /* You must exclude buttons from the drag region so they can be clicked */
      -webkit-app-region: no-drag; 
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--border-color);
      cursor: pointer;
      padding: 2px 8px;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      background: var(--border-color);
      color: #000;
    }

    .content {
      padding: 20px;
      flex-grow: 1;
      overflow-y: auto; /* Adds scrolling if content gets too long */
    }
  </style>
  <title>Document</title>
</head>
<body>
  <div class="sci-fi-wrapper">
    <div class="sci-fi-border">
      <div class="sci-fi-app">
        
        <div class="titlebar">
          <span>UPLINK_TERMINAL</span>
          <button class="close-btn">X</button>
        </div>

        <div class="content">
          <p>System initialized. Awaiting input...</p>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
